<div class="row justify-content-center"><div class="col-12 col-md-6 col-lg-5">
<h1 class="h3">Admin login</h1><p>Sign in to add, edit, or delete trips.</p>
<div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3"><label class="form-label" for="email">Email address</label>
  <input id="email" class="form-control" type="email" formControlName="email" autocomplete="username" required></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
  <input id="password" class="form-control" type="password" formControlName="password" autocomplete="current-password" required></div>
  <p *ngIf="form.touched && form.invalid" class="text-danger" role="alert">Enter a valid email and your password.</p>
  <button class="btn btn-primary" type="submit" [disabled]="busy">{{ busy ? 'Signing in…' : 'Log in' }}</button>
</form></div></div>
