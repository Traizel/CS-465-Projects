<div class="card trip-card">
  <div class="card-header fw-semibold">{{ trip.name }}</div>
  <img class="card-img-top" [src]="'assets/images/' + trip.image" [alt]="trip.name">
  <div class="card-body d-flex flex-column">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="small text-muted mb-2">{{ trip.length }} · {{ trip.perPerson | currency:'USD':'symbol' }} per person</p>
    <p class="small text-muted mb-2">Departure: {{ trip.start | date:'mediumDate':'UTC' }}</p>
    <div class="trip-description card-text" [innerHTML]="trip.description"></div>
    <div class="mt-auto pt-3 d-flex gap-2">
      <a class="btn btn-outline-primary btn-sm" [routerLink]="['/edit-trip', trip.code]">Edit Trip</a>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="requestDelete()">Delete</button>
    </div>
  </div>
</div>
